<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 3rd Monthsary, Baby! ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #ffdee9, #b5fffc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ff4f81;
    }

    p {
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .question {
      font-size: 22px;
      margin-bottom: 20px;
      color: #333;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      border: none;
      padding: 14px;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .answer-btn {
      background: #ffe3ec;
      color: #333;
    }

    .answer-btn:hover {
      transform: scale(1.02);
      background: #ffd2e1;
    }

    .start-btn,
    .restart-btn {
      background: #ff4f81;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .start-btn:hover,
    .restart-btn:hover {
      background: #ff2f6b;
    }

    .hidden {
      display: none;
    }

    .progress {
      margin-bottom: 20px;
      font-size: 14px;
      color: #777;
    }

    video {
      width: 100%;
      border-radius: 20px;
      margin-top: 20px;
    }

    .heart {
      font-size: 40px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }

      .question {
        font-size: 20px;
      }

      button {
        font-size: 15px;
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Start Screen -->
    <div id="start-screen">
      <div class="heart">❤️</div>

      <h1>Happy 3rd Monthsary</h1>

      <p>
        I made a little game for you hehe.<br>
        Answer everything correctly to unlock your surprise ❤️
      </p>

      <button class="start-btn" onclick="startQuiz()">
        Start
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>
    </div>

    <!-- Final Screen -->
    <div id="final-screen" class="hidden">

      <div class="heart">🎉</div>

      <h1>You Did It!</h1>

      <p>
        Congratulations my love ❤️<br>
        Here’s your reward hehe.
      </p>

      <video controls>
        <source src="video.mp4" type="video/mp4">
      </video>

      <button class="restart-btn" onclick="restartQuiz()">
        Play Again
      </button>

    </div>

  </div>

  <script>

    const questions = [
      {
        question: "Who confessed first?",
        answers: ["Me", "You", "Both"],
        correct: "Me"
      },
      {
        question: "What is our favorite thing to do together?",
        answers: ["Sleep 👀", "Smoke", "Eat"],
        correct: "Eat"
      },
      {
        question: "When did I confessed? 😏",
        answers: ["October 18", "December 5", "November 5"],
        correct: "November 5"
      },
      {
        question: "I told you this is when I knew I fell for you, when was it? 😏",
        answers: [
          "When you and I were talking about person A and B at smoking area",
          "When you took the left over chicken from izakaya",
          "The first time we smoke together"
        ],
        correct: "When you took the left over chicken from izakaya"
      },
      {
        question: "Color of the first flower I gave you...",
        answers: ["Pink", "Yellow", "Mixed"],
        correct: "Yellow"
      },
      {
        question: "Where did you say 'I love you' for the first time?",
        answers: ["At Mika's", "In front of Tokyo Tower", "At Two Face"],
        correct: "At Two Face"
      },
      {
        question: "What is the song we slow danced to?",
        answers: [
          "Can't take my eyes of you",
          "Soft Spot",
          "Put your head on my shoulders"
        ],
        correct: "Put your head on my shoulders"
      },
      {
        question: "First movie we saw together...",
        answers: [
          "Wuthering Heights",
          "Curious Case of Benjamin Button",
          "Apex"
        ],
        correct: "Curious Case of Benjamin Button"
      },
      {
        question: "What’s my true love language?",
        answers: [
          "Physical touch",
          "Words of affirmation",
          "Quality time"
        ],
        correct: "SPECIAL"
      },
      {
        question: "How much do I love you?",
        answers: [
          "So much",
          "Infinite",
          "More every day"
        ],
        correct: "SPECIAL2"
      }
    ];

    let currentQuestion = 0;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const finalScreen = document.getElementById("final-screen");

    function startQuiz() {
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {

      const questionEl = document.getElementById("question");
      const answersEl = document.getElementById("answers");
      const progressEl = document.getElementById("progress");

      const current = questions[currentQuestion];

      progressEl.innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      questionEl.innerText = current.question;

      answersEl.innerHTML = "";

      current.answers.forEach(answer => {

        const btn = document.createElement("button");

        btn.innerText = answer;
        btn.classList.add("answer-btn");

        btn.onclick = () => checkAnswer(answer);

        answersEl.appendChild(btn);

      });
    }

    function celebrate() {

      const emojis = ["❤️", "✨", "💖"];

      for(let i = 0; i < 12; i++) {

        const floating = document.createElement("div");

        floating.innerHTML =
          emojis[Math.floor(Math.random() * emojis.length)];

        floating.style.position = "fixed";
        floating.style.left = Math.random() * 100 + "vw";
        floating.style.top = "70vh";
        floating.style.fontSize = "22px";
        floating.style.opacity = "0.8";
        floating.style.zIndex = "999";
        floating.style.transition = "2.5s ease-out";

        document.body.appendChild(floating);

        setTimeout(() => {
          floating.style.top = "20vh";
          floating.style.opacity = "0";
        }, 100);

        setTimeout(() => {
          floating.remove();
        }, 2600);
      }
    }

    function checkAnswer(answer) {

      const current = questions[currentQuestion];
      const correct = current.correct;

      // SPECIAL LAST 2 QUESTIONS
      if(correct === "SPECIAL" || correct === "SPECIAL2") {

        const answersEl = document.getElementById("answers");

        current.answers =
          current.answers.filter(a => a !== answer);

        // still wrong
        if(current.answers.length > 0) {

          alert("Wrong answer bb hehe ❤️");
          showQuestion();
          return;
        }

        // reveal real answer
        alert("At this point I think you deserve the real answer 😭❤️");

        answersEl.innerHTML = "";

        const gif = document.createElement("img");

        if(correct === "SPECIAL") {

          gif.src =
            "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMDFieGQ1eDczemRyanFzbzI0MHZhenJzNmpncGY1emlscjBwNnNqciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lv2VhwHrt6ljhvZ6LF/giphy.gif";

        } else {

          gif.src =
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ODQwczBzNzk0bXVueGR2OWZta3E2emo1dGJpN250bDZsM2JjOXV2cSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Kg5Q7JSJiV0XgrJVRc/giphy.gif";
        }

        gif.style.width = "220px";
        gif.style.borderRadius = "20px";
        gif.style.marginBottom = "20px";

        const sweetMessage = document.createElement("div");

        sweetMessage.style.fontSize = "22px";
        sweetMessage.style.fontWeight = "bold";
        sweetMessage.style.color = "#ff4f81";
        sweetMessage.style.marginBottom = "20px";
        sweetMessage.style.lineHeight = "1.5";

        if(correct === "SPECIAL") {

          sweetMessage.innerHTML =
            "The real answer is... <br><br> ALL OF IT when it’s from you ❤️";

        } else {

          sweetMessage.innerHTML =
            "The real answer is... <br><br> There’s literally no correct answer because it’s too much ✅😭";
        }

        const continueBtn = document.createElement("button");

        continueBtn.innerText = "AWWWW 🥺";
        continueBtn.classList.add("answer-btn");

        continueBtn.onclick = () => {

          currentQuestion++;

          if(currentQuestion < questions.length) {
            showQuestion();
          } else {
            quizScreen.classList.add("hidden");
            finalScreen.classList.remove("hidden");
          }
        };

        answersEl.appendChild(gif);
        answersEl.appendChild(sweetMessage);
        answersEl.appendChild(continueBtn);

        return;
      }

      // NORMAL QUESTIONS
      if(answer === correct) {

        celebrate();

        setTimeout(() => {

          currentQuestion++;

          if(currentQuestion < questions.length) {
            showQuestion();
          } else {
            quizScreen.classList.add("hidden");
            finalScreen.classList.remove("hidden");
          }

        }, 1200);

      } else {

        alert("Wrong answer bb hehe try again ❤️");
      }
    }

    function restartQuiz() {

      currentQuestion = 0;

      questions[8].answers = [
        "Physical touch",
        "Words of affirmation",
        "Quality time"
      ];

      questions[9].answers = [
        "So much",
        "Infinite",
        "More every day"
      ];

      finalScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    }

  </script>

</body>
</html>
